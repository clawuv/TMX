name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
            args: --mac --arm64
          - os: windows-2022
            platform: Windows-x64
            args: --win --x64
          - os: ubuntu-22.04
            platform: Linux-x64
            args: --linux --x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - name: Validate macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Rebuild native modules for Electron
        run: npm run rebuild:natives
      - name: Prepare terminal runtime helpers
        run: node node_modules/node-pty/scripts/post-install.js
      - name: Build installers
        if: runner.os != 'macOS'
        run: npm run build -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Import Developer ID into temporary keychain
        if: runner.os == 'macOS'
        run: node scripts/ci-macos-keychain.mjs
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Build signed and notarized macOS installers
        if: runner.os == 'macOS'
        run: npm run build -- ${{ matrix.args }} --publish never -c.mac.forceCodeSigning=true -c.mac.hardenedRuntime=true -c.mac.notarize=true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS distribution signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          app="release/$version/mac-arm64/TMX.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ] && [ -f "$CSC_KEYCHAIN" ]; then
            security delete-keychain "$CSC_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*/TMX_*.dmg
            release/*/TMX_*.zip
            release/*/TMX_*.exe
            release/*/TMX_*.AppImage
            release/*/TMX_*.blockmap
            release/*/latest*.yml

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish installers and update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -f "docs/releases/${RELEASE_TAG}.md" ]; then
            cp "docs/releases/${RELEASE_TAG}.md" notes.md
          else
            printf 'TMX %s\n' "$RELEASE_TAG" > notes.md
          fi
          mapfile -d '' files < <(find artifacts -type f \( -name 'TMX_*' -o -name 'latest*.yml' \) -print0)
          test "${#files[@]}" -gt 0
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "TMX $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file notes.md
